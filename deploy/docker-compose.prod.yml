services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qrstars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smartreview}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qrstars}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-qrstars}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-smartreview}
      POOL_MODE: session
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: md5
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: >
      valkey-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Временное файловое хранилище на этом VPS: Beget S3 потерян в аварии 2026-11-02.
  # Официальные образы MinIO больше не публикуются — замороженная сборка Bitnami.
  # Ключи — S3_ACCESS_KEY / S3_SECRET_KEY из .env. Бакет создаёт приложение (ensureBucket в
  # src/lib/s3.ts) с анонимным чтением только объектов, без листинга. MINIO_DEFAULT_BUCKETS
  # не задаём: его политика «download» открывает список файлов. Снаружи — nginx /storage/.
  minio:
    image: bitnamilegacy/minio:2025.5.24
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      # Вне /opt/qrstars: deploy.sh синхронизирует его rsync --delete и стёр бы файлы.
      - /var/lib/qrstars/minio:/bitnami/minio/data
      # Сюда pg-backup-local.sh выгружает файлы обычными файлами (mc mirror).
      - /var/backups/qrstars/files:/backup
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Blue-green: only one slot serves traffic at a time (see deploy/deploy.sh).
  app_blue: &app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://app.qrstars.ru}
        NEXT_PUBLIC_VK_CLIENT_ID: ${NEXT_PUBLIC_VK_CLIENT_ID:-54734947}
        NEXT_PUBLIC_VK_REDIRECT_URI: ${NEXT_PUBLIC_VK_REDIRECT_URI:-https://app.qrstars.ru/auth/vk/callback}
    restart: unless-stopped
    container_name: deploy-app-blue
    env_file: .env
    # С нового VPS основной адрес api.telegram.org (149.154.166.110) недоступен, этот — открыт.
    # Если Telegram перестанет отвечать — проверить: curl --resolve api.telegram.org:443:<ip> …/getMe
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
      # Свой Postfix на хосте — SMTP_HOST=host.docker.internal
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qrstars}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smartreview}?schema=public
      REDIS_URL: redis://valkey:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://app.qrstars.ru}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /opt/qrstars/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/auth/csrf"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s

  app_green:
    <<: *app
    container_name: deploy-app-green
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/auth/csrf"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s

volumes:
  pgdata:
