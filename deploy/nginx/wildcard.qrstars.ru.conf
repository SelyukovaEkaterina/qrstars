# Клиентские микросайты: {slug}.qrstars.ru
# Включается deploy.sh только когда выпущен сертификат
# /etc/letsencrypt/live/qrstars.ru-wildcard/fullchain.pem
# Точные server_name (app, www, qrstars.ru) важнее этой маски.

server {
    listen 80;
    listen [::]:80;
    server_name *.qrstars.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.qrstars.ru;

    ssl_certificate /etc/letsencrypt/live/qrstars.ru-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrstars.ru-wildcard/privkey.pem;
    # RSA рядом с ECDSA — для старых клиентов без ECDSA (certbot --cert-name qrstars.ru-wildcard-rsa)
    ssl_certificate /etc/letsencrypt/live/qrstars.ru-wildcard-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrstars.ru-wildcard-rsa/privkey.pem;
    # Только TLS 1.2: TLS 1.3 у части клиентов в РФ режется по пути (ТСПУ)
    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;

    location /storage/ {
        proxy_pass https://s3.ru1.storage.beget.cloud/1919a3d97e3e-qrstarsru/;
        proxy_set_header Host s3.ru1.storage.beget.cloud;
        proxy_ssl_server_name on;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /_next/static/ {
        proxy_pass http://qrstars_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://qrstars_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
