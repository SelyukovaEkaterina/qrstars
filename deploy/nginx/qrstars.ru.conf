# Лендинг (Astro, landing/) — статика с диска VPS, публикуется deploy/deploy-landing.sh
# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name qrstars.ru www.qrstars.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qrstars.ru www.qrstars.ru;

    ssl_certificate /etc/letsencrypt/live/qrstars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrstars.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /q/ {
        proxy_pass https://app.qrstars.ru;
        proxy_set_header Host app.qrstars.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /var/www/qrstars;
    index index.html;

    # Файлы с хэшем в имени
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        # Неизвестный путь → index.html (как раньше на S3 website)
        try_files $uri /index.html;
    }
}
