# Лендинг (Astro, landing/) — статика с диска VPS, публикуется deploy/deploy-landing.sh
# HTTP → HTTPS (always apex domain)
server {
    listen 80;
    listen [::]:80;
    server_name qrstars.ru www.qrstars.ru;
    return 301 https://qrstars.ru$request_uri;
}

# www → apex on HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.qrstars.ru;

    ssl_certificate /etc/letsencrypt/live/qrstars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrstars.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://qrstars.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qrstars.ru;

    ssl_certificate /etc/letsencrypt/live/qrstars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrstars.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy app routes (QR scans, activation, scan UI) from landing → app container
    location ~ ^/(q|scan|activate)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host app.qrstars.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    root /var/www/qrstars;
    index index.html;

    # Файлы с хэшем в имени
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Неизвестный путь → index.html (как раньше на S3 website)
        try_files $uri /index.html;
    }
}
