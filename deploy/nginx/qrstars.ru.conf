# Лендинг (Astro, landing/) — статика с диска VPS, публикуется deploy/deploy-landing.sh
# HTTP → HTTPS (always apex domain)
server {
    listen 80;
    listen [::]:80;
    server_name qrstars.ru www.qrstars.ru;
    return 301 https://qrstars.ru$request_uri;
}

# www → apex on HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.qrstars.ru;

    ssl_certificate /etc/letsencrypt/live/qrstars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrstars.ru/privkey.pem;
    # RSA рядом с ECDSA — для старых клиентов без ECDSA (certbot --cert-name qrstars.ru-rsa)
    ssl_certificate /etc/letsencrypt/live/qrstars.ru-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrstars.ru-rsa/privkey.pem;
    # Вместо include options-ssl-nginx.conf (общий для всех сайтов на VPS): только TLS 1.2,
    # TLS 1.3 у части клиентов в РФ режется по пути (ТСПУ)
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://qrstars.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qrstars.ru;

    ssl_certificate /etc/letsencrypt/live/qrstars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrstars.ru/privkey.pem;
    # RSA рядом с ECDSA — для старых клиентов без ECDSA (certbot --cert-name qrstars.ru-rsa)
    ssl_certificate /etc/letsencrypt/live/qrstars.ru-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrstars.ru-rsa/privkey.pem;
    # Вместо include options-ssl-nginx.conf (общий для всех сайтов на VPS): только TLS 1.2,
    # TLS 1.3 у части клиентов в РФ режется по пути (ТСПУ)
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy app routes (QR scans, activation, scan UI) from landing → app container
    location ~ ^/(q|scan|activate)/ {
        # Апстрим blue-green из conf.d/qrstars-upstream.conf: жёсткий порт 3000 ломал
        # qrstars.ru/q/… каждый раз, когда активным становился слот green (3001).
        proxy_pass http://qrstars_app;
        proxy_set_header Host app.qrstars.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    root /var/www/qrstars;
    index index.html;

    # Файлы с хэшем в имени
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Неизвестный путь → index.html (как раньше на S3 website)
        try_files $uri /index.html;
    }
}
